# tmux-agent-sidebar plugin
# Load via the entry point script:
#   run-shell /path/to/tmux-agent-sidebar.tmux
#
# Customizable options (set BEFORE loading to override):
#   @sidebar_width        - sidebar width in columns, or percentage of window width (default: 35)
#   @sidebar_position     - sidebar placement: left or right (default: left)
#   @sidebar_bottom_height - bottom panel height in lines (default: 0; positive to show)
#   @sidebar_auto_create  - create sidebar automatically for new windows (default: off)
#   @sidebar_auto_create_delay - seconds to defer auto-create after a new window is
#                                created so a declaratively-built window (e.g.
#                                tmuxinator's split-window + select-layout) finishes
#                                first; accepts fractional seconds (default: 0)
#   @sidebar_pet          - show pet animation in bottom panel (default: off)
#   @sidebar_hook_check_agents - comma-separated agents whose hook setup is checked
#                                in notices (default: codex; add claude when used)
#   @sidebar_key          - keybinding to toggle sidebar; off disables it (default: A)
#   @sidebar_key_all      - legacy alias keybinding for the singleton toggle; off disables it (default: off)
#   @sidebar_close_key    - close keybinding; off disables it (default: M-A)
#   @sidebar_color_*      - 256-color codes or #RRGGBB hex colors for sidebar elements
#
# Internal tmux options used by the plugin:
#   @agent_sidebar_dir    - plugin directory (auto-detected by tmux-agent-sidebar.tmux)
#   @sidebar_pid          - pane option used to notify the running sidebar instance

# --- Plugin location ---
# @agent_sidebar_dir must be set by tmux-agent-sidebar.tmux before sourcing this file

# --- Sidebar options ---
# Colors are managed in Rust (src/ui/colors.rs). Users may override any
# @sidebar_color_* tmux option in their own config. Non-color sidebar
# options are seeded here only when unset.
if -F '#{==:#{@sidebar_width},}' 'set -g @sidebar_width 35'
if -F '#{==:#{@sidebar_position},}' 'set -g @sidebar_position left'
if -F '#{==:#{@sidebar_bottom_height},}' 'set -g @sidebar_bottom_height 0'
if -F '#{==:#{@sidebar_auto_create},}' 'set -g @sidebar_auto_create off'
if -F '#{==:#{@sidebar_auto_create_delay},}' 'set -g @sidebar_auto_create_delay 0'
if -F '#{==:#{@sidebar_pet},}' 'set -g @sidebar_pet off'
if -F '#{==:#{@sidebar_hook_check_agents},}' 'set -g @sidebar_hook_check_agents codex'
if -F '#{==:#{@sidebar_key},}' 'set -g @sidebar_key A'
if -F '#{==:#{@sidebar_key_all},}' 'set -g @sidebar_key_all off'
if -F '#{==:#{@sidebar_close_key},}' 'set -g @sidebar_close_key M-A'

# --- Keybindings ---
run-shell 'key="$(tmux display-message -p "#{@sidebar_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; [ "$key" = off ] || tmux bind "$key" run-shell "\"$bin\" toggle \"##{window_id}\" \"##{pane_current_path}\" \"##{pane_id}\""'
run-shell 'key="$(tmux display-message -p "#{@sidebar_key_all}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; [ "$key" = off ] || tmux bind "$key" run-shell "\"$bin\" toggle-all \"##{window_id}\" \"##{pane_current_path}\" \"##{pane_id}\""'
run-shell 'key="$(tmux display-message -p "#{@sidebar_close_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; [ -z "$key" ] || [ "$key" = off ] || tmux bind "$key" run-shell "\"$bin\" close \"##{window_id}\" \"##{pane_id}\""'

# --- Hooks (remove our own entries first to prevent duplicates on config reload) ---
run-shell 'tmux show-hooks -g after-new-window | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-pane | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g pane-exited | awk "/@agent_sidebar_bin/ && /auto-close/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'for hook in after-select-window session-window-changed client-session-changed client-attached client-detached client-resized; do tmux show-hooks -g "$hook" 2>/dev/null | awk "/@agent_sidebar_bin/ && /follow/ { print \$1 }" | xargs -rn1 tmux set-hook -gu; done'

# --- Auto sidebar on new window (create-only, no toggle) ---
# With @sidebar_auto_create_delay non-zero, defer the create-only split into a
# backgrounded shell that sleeps first. This lets a window built declaratively
# (e.g. tmuxinator's split-window + select-layout sequence) finish before the
# sidebar pane is injected — otherwise the sidebar lands while the window still
# has one pane and the later select-layout is computed with an extra pane,
# scrambling pane sizes and roles. The sync/deferred choice is fixed at load
# time; the duration itself is read at fire time. Switching the delay between
# zero and non-zero needs a config reload to re-pick the hook.
if -F '#{!=:#{@sidebar_auto_create},off}' {
  if -F '#{==:#{@sidebar_auto_create_delay},0}' {
    set-hook -ga after-new-window 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\" \"#{pane_id}\""'
  } {
    set-hook -ga after-new-window 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\" \"#{pane_id}\""'
  }
}

# --- Move the singleton sidebar with the sole attached client ---
# These hooks only move an existing pane. Command-after hooks pass their exact
# target synchronously. Client/session notifications run in the background and
# re-resolve the client's current window after tmux commits the switch, so rapid
# switches converge on current state instead of replaying stale targets.
set-hook -ga after-select-window 'run-shell "\"#{@agent_sidebar_bin}\" follow \"#{hook_client}\" \"#{window_id}\""'
set-hook -ga session-window-changed 'run-shell -b "\"#{@agent_sidebar_bin}\" follow"'
set-hook -ga client-session-changed 'run-shell -b "\"#{@agent_sidebar_bin}\" follow \"#{hook_client}\""'
set-hook -ga client-attached 'run-shell -b "\"#{@agent_sidebar_bin}\" follow \"#{hook_client}\""'
set-hook -ga client-detached 'run-shell -b "\"#{@agent_sidebar_bin}\" follow"'
set-hook -ga client-resized 'run-shell "\"#{@agent_sidebar_bin}\" follow \"#{hook_client}\" \"#{window_id}\""'

# --- Notify sidebar on pane focus change (SIGUSR1 → instant refresh) ---
set-hook -ga after-select-pane "run-shell -b 'tmux list-panes -t \"#{window_id}\" -F \"#{@sidebar_pid}\" 2>/dev/null | while read pid; do [ -n \"\$pid\" ] && kill -USR1 \"\$pid\" 2>/dev/null; done; true'"

# The legacy pane-exited auto-close hook is intentionally not reinstalled: in
# singleton mode it could destroy the only sidebar process with its window.
