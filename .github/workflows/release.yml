name: Release

on:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types: [upstream-synced]

env:
  RELEASE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.sha }}
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: tmux-agent-sidebar-darwin-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: tmux-agent-sidebar-darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tmux-agent-sidebar-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tmux-agent-sidebar-linux-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tmux-agent-sidebar ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            changelog="$(git log --pretty=format:'- %s (%h)' "${prev_tag}..${RELEASE_REF}")"
          else
            changelog="$(git log -10 --pretty=format:'- %s (%h)' "$RELEASE_REF")"
          fi
          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo
            echo "$changelog"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${RELEASE_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: tmux-agent-sidebar-*
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          make_latest: true
